name: codepath
description: "Aprenda lógica de programação com trilhas, exercícios e desafios."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: 9.2.4
  url_launcher: 6.3.2
  package_info_plus: 8.3.1
  intl: 0.20.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 1. ADICIONADO AQUI: O pacote precisa estar listado!
  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/imagens/
    - assets/fundos_trilhas/

# 2. CORRIGIDO AQUI: Esta seção fica FORA do "flutter:", na raiz do arquivo
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/imagens/Icone.png"
  min_sdk_android: 21
