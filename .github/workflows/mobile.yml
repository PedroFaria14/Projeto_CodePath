name: Mobile Android

on:
  push:
    paths: ['Frontend/**', 'Backend/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['Frontend/**', 'Backend/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Gerar AAB assinado (exige configuração e chave de upload)'
        type: boolean
        default: false
      build_number:
        description: 'versionCode inédito e maior que o último enviado à Play Store'
        type: string

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'Backend/requirements-*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/code_path_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Avisos informativos legados continuam visíveis; warnings/erros bloqueiam.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - run: python ../../tools/check_native_alignment.py build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: codepath-apk-teste
          path: Frontend/code_path_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [backend, android]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/code_path_flutter
    env:
      ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/Frontend/code_path_flutter/android/upload-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - name: Preparar configuração e chave sem expor credenciais
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_CONFIG: ${{ vars.CODEPATH_RELEASE_CONFIG }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib
          number = os.environ['BUILD_NUMBER']
          if not number.isdigit() or not 0 < int(number) <= 2100000000:
              raise SystemExit('Informe um versionCode válido.')
          for name in ['ANDROID_APPLICATION_ID', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD', 'KEYSTORE_BASE64', 'RELEASE_CONFIG']:
              if not os.environ.get(name):
                  raise SystemExit(f'Configuração ausente: {name}')
          config = json.loads(os.environ['RELEASE_CONFIG'])
          pathlib.Path('config/release.json').write_text(json.dumps(config), encoding='utf-8')
          pathlib.Path(os.environ['ANDROID_KEYSTORE_PATH']).write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          PY
      - run: flutter pub get --enforce-lockfile
      - name: Gerar Android App Bundle
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: flutter build appbundle --release --build-number="$BUILD_NUMBER" --dart-define-from-file=config/release.json
      - run: python ../../tools/check_native_alignment.py build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: codepath-aab-release
          path: Frontend/code_path_flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Limpar chave do runner
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib
          pathlib.Path(os.environ['ANDROID_KEYSTORE_PATH']).unlink(missing_ok=True)
          pathlib.Path('config/release.json').unlink(missing_ok=True)
          PY
