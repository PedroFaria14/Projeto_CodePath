name: codepath
description: Um aplicativo interativo e dinâmico para o ensino de programação.

publish_to: "none" # Remova esta linha se for publicar no pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.2.1 # Adicione esta linha para requisições HTTP
  shared_preferences: ^2.2.3 # Para armazenar o token de forma persistente

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Bold.ttf
          weight: 700
